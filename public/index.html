<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SilentOS</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; font: 16px system-ui, sans-serif; color: #edf3f0; background: #141c19 }
  main { width: min(100% - 2rem, 54rem); margin: 3rem auto }
  h1 { font-size: clamp(2.5rem, 7vw, 4rem); letter-spacing: -.06em; margin: 0 0 .5rem }
  form, section { padding: 1.25rem; margin: 1rem 0; border: 1px solid #42524b; border-radius: 1rem; background: #202b26 }
  label { display: block; margin-bottom: .8rem }
  input, textarea { display: block; width: 100%; margin-top: .4rem; border: 1px solid #60756b; border-radius: .5rem; background: #121a17; color: inherit; padding: .7rem; font: inherit }
  button { font: inherit; font-weight: 650; border: 0; border-radius: .5rem; padding: .65rem .9rem; margin: .25rem .25rem .25rem 0; color: #15221c; background: #a9edcb; cursor: pointer }
  button:disabled { opacity: .5; cursor: default }
  button.secondary { background: #d4dfda }
  #media { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem }
  figure { margin: 0 }
  video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #0d1310; border-radius: .5rem }
  figcaption { margin-top: .25rem }
  #status { min-height: 1.5em; color: #b7cebf }
  #speak-form { margin-bottom: 0; padding: 0; border: 0 }
</style>
<main>
  <h1>SilentOS</h1>
  <p>Type a message and speak it into the call with a synthetic voice.</p>
  <form id="join-form">
    <label>Your name <input name="name" required maxlength="40" autocomplete="name"></label>
    <label>Room name <input name="room" required value="silent-demo" maxlength="64" pattern="[A-Za-z0-9_\-]+" title="Use letters, numbers, underscores or dashes"></label>
    <button>Join room</button>
  </form>
  <section id="call" hidden aria-label="Call controls">
    <h2 id="room-title"></h2>
    <button type="button" id="camera" class="secondary" aria-pressed="false">Camera off</button>
    <button type="button" id="mic" class="secondary" aria-pressed="false">Mic muted</button>
    <button type="button" id="audio" class="secondary" aria-pressed="false">Call audio off</button>
    <button type="button" id="leave" class="secondary">Leave</button>
    <div id="media"></div>
    <form id="speak-form">
      <label>Message <textarea name="text" required maxlength="500" rows="3" placeholder="Type what you want the other caller to hear"></textarea></label>
      <button>Speak</button>
    </form>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="/app.js"></script>
</html>
